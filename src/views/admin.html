<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>문의 · 예약 관리 | EE Up Battery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f6f8fa; font-family: 'Malgun Gothic', system-ui, sans-serif; word-break: keep-all; }
    .top { background: #1a2a3a; color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
    .top a { color: #cfe; }
    .badge-new { background: #c52a42; }
    .badge-done { background: #5b6774; }
    td { vertical-align: top; }
    .msg { white-space: pre-line; max-width: 360px; }
    .memo { min-width: 180px; }
  </style>
</head>
<body>
  <!-- 이 화면은 HTTP 기본 인증(.env 의 ADMIN_USER · ADMIN_PASSWORD) 뒤에 있다(middleware/requireAdmin.js). -->
  <div class="top">
    <strong><i class="bi bi-inbox" aria-hidden="true"></i> 문의 · 예약 관리</strong>
    <a href="/" target="_blank" rel="noopener">홈페이지 보기</a>
  </div>
  <main class="container-fluid py-4">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <div class="btn-group" role="group" aria-label="상태로 보기">
        <button type="button" class="btn btn-outline-dark active" data-view="new" aria-pressed="true">미처리</button>
        <button type="button" class="btn btn-outline-dark" data-view="done" aria-pressed="false">처리 완료</button>
        <button type="button" class="btn btn-outline-dark" data-view="all" aria-pressed="false">전체</button>
      </div>
      <span id="count" class="text-secondary" aria-live="polite"></span>
      <button type="button" class="btn btn-sm btn-outline-secondary ms-auto" id="reload"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i> 새로고침</button>
    </div>
    <div class="table-responsive bg-white border rounded">
      <table class="table table-sm mb-0">
        <thead class="table-light">
          <tr><th>접수</th><th>종류</th><th>고객</th><th>차종</th><th>작업</th><th>희망 일정</th><th>내용</th><th>상태 · 메모</th><th></th></tr>
        </thead>
        <tbody id="rows"><tr><td colspan="9" class="text-center text-secondary py-4">불러오는 중…</td></tr></tbody>
      </table>
    </div>
  </main>
  <script src="/assets/js/admin.js" defer></script>
</body>
</html>
